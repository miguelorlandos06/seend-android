name: Build armeabi-v7a (debug)

on:
  push:
    branches:
      - main
      - 'build/**'
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-armeabi-v7a.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: 'Rama / tag / commit a compilar (vacío = rama por defecto)'
        required: false
        default: ''

concurrency:
  group: armeabi-v7a-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  BUILD_TOOLS_VERSION: '34.0.0'
  COMPILE_SDK: '34'
  TARGET_ABI: 'armeabi-v7a'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.caching=true -Dorg.gradle.configuration-cache=true'

permissions:
  contents: read

jobs:
  build:
    name: assembleDebug (armeabi-v7a)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      # v4 configura ANDROID_HOME y pone cmdline-tools en el PATH de forma fiable.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # `echo y` en lugar de `yes` para evitar SIGPIPE con pipefail.
      - name: Install pinned SDK packages
        run: |
          set -euo pipefail
          echo y | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS_VERSION}"

      - name: Assemble debug APK (armeabi-v7a)
        run: ./gradlew --no-daemon :app:assembleDebug -Pseend.target_abi=${TARGET_ABI} --stacktrace

      - name: Locate and report APK
        id: apk
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-${TARGET_ABI}-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: no se encontró $APK" >&2
            ls -la app/build/outputs/apk/debug/ >&2 || true
            exit 1
          fi
          SIZE_BYTES=$(stat -c%s "$APK")
          echo "APK: $APK (~$(( SIZE_BYTES / 1024 )) KiB)"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "apk_size=$SIZE_BYTES" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: seend-armeabi-v7a-debug
          path: app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7